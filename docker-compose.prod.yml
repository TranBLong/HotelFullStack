services:
  app:
    image: docker.io/${DOCKER_USER}/hotel-fullstack:latest
    container_name: hotelblazor
    restart: always
    mem_limit: 640m
    ports:
      - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=hoteldb;User=hotel;Password=${DB_APP_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-network

  db:
    image: mariadb:11.4
    container_name: hotel-mariadb
    restart: always
    mem_limit: 512m
    # utf8mb4 để lưu đúng tiếng Việt; giảm buffer pool cho máy 2 GB RAM
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=hoteldb
      - MARIADB_USER=hotel
      - MARIADB_PASSWORD=${DB_APP_PASSWORD}
    volumes:
      - hotel-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hotel-network

networks:
  hotel-network:
    driver: bridge

volumes:
  hotel-db-data: