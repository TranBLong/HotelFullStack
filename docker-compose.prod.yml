services:
  app:
    image: docker.io/${DOCKER_USER}/hotel-fullstack:latest
    container_name: hotelblazor
    restart: always
    ports:
      - "3001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=User Id=hotel;Password=${DB_APP_PASSWORD};Data Source=db:1521/FREEPDB1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-network

  db:
    image: gvenzl/oracle-free:slim
    container_name: hotel-oracle
    restart: always
    environment:
      - ORACLE_PASSWORD=${DB_SYS_PASSWORD}
      - APP_USER=hotel
      - APP_USER_PASSWORD=${DB_APP_PASSWORD}
    volumes:
      - hotel-oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - hotel-network

networks:
  hotel-network:
    driver: bridge

volumes:
  hotel-oracle-data: