name: CI/CD - Docker Build & Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/wtabs_socibot_ai:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/wtabs_socibot_ai:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/wtabs_socibot_ai:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/wtabs_socibot_ai:${{ github.sha }}
